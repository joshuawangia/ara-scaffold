construction_alignment_candidates: 150
construction_alignment_max_unresolved: 5 # Absolute count; above this limit refuses freeze.
construction_alignment_min_score: 0.10
construction_alignment_paper_diversity: true
judge_symbol_alignment_max_output_tokens: 2048
construction_targeted_corrections: 2
provider: anthropic
model: claude-opus-5
fallbacks: [claude-opus-4-8]
effort: high
max_output_tokens: 8192
token_cap: 200000
cost_cap_usd: 10.0
depth_cap: 6
node_cap: 500
seed: 0
forward_pass_depth: 2
essay_word_limit: 6000
essay_min_words: 4500
target_candidates: 30
target_context_hops: 1  # full gap/formal neighbourhood; remaining T stays compact and citable
semantic_conflict_pair_limit: 60
classify_conflict_max_output_tokens: 1024
publication_min_words: 3000
essay_audit_samples: 3
cache_dir: cache
runs_dir: runs
web_search_max_uses: 5
stages:
  # Empty construction overrides inherit the run's provider/model.
  select_t_roots: {}
  build_t_batch: {}
  construction_correction: {}
  extraction:
    model: claude-sonnet-5-5
    fallbacks: []
    effort: high
    thinking: adaptive
pricing:
  claude-sonnet-5-5:
    input_per_million_usd: 2.0
    output_per_million_usd: 10.0
    cache_read_per_million_usd: 0.10
    cache_write_5m_per_million_usd: 2.50
    cache_write_1h_per_million_usd: 4.0
    web_search_per_thousand_usd: 10.0
    rates_source: https://platform.claude.com/docs/en/about-claude/pricing
    rates_verified_date: '2026-10-21'
  claude-opus-5:
    input_per_million_usd: 5.0
    output_per_million_usd: 25.0
    cache_read_per_million_usd: 0.5
    cache_write_5m_per_million_usd: 6.25
    cache_write_1h_per_million_usd: 10.0
    web_search_per_thousand_usd: 10.0
    ancillary_rates_status: verify-before-provider-implementation
  claude-opus-4-8:
    input_per_million_usd: 5.0
    output_per_million_usd: 25.0
smoke:
  target_candidates: 2
  depth_cap: 1
  node_cap: 8
  forward_pass_depth: 1
  essay_word_limit: 300
  essay_min_words: 150
  max_output_tokens: 8192
  web_search_max_uses: 1
  token_cap: 1000000
  cost_cap_usd: 5.0
  validation_attempts: 3
# Runtime provider projection and conservative web-call reservation.
formula_output_depth: 2
model_context_token_bound: 200000

# Operator-editable per-run caps; no separate aggregate spend guard.
pilot:
  target_candidates: 30
  depth_cap: 6
  node_cap: 500
  forward_pass_depth: 2
  essay_word_limit: 6000
  essay_min_words: 4500
  write_essay_max_output_tokens: 20000
  audit_essay_max_output_tokens: 24000
  search_evidence_max_output_tokens: 64000
  verify_originality_citations_max_output_tokens: 48000
  token_cap: 10000000
  cost_cap_usd: 100.0
  validation_attempts: 3

# Extraction is also subject to the enclosing per-run token/cost caps.
extraction_cost_cap_usd: 30.0
extract_paper_max_output_tokens: 32000
extraction_estimated_tokens_per_page: 1500
extraction_max_failed_papers: 8

# Only generated extraction literature receives this build-T output allowance.
extracted_build_t_max_output_tokens: 64000
select_t_roots_max_output_tokens: 16384
# Explicit batch profile; ordinary/default run caps remain unchanged.
extraction:
  token_cap: 6000000
  cost_cap_usd: 30.0
  extraction_cost_cap_usd: 30.0
  validation_attempts: 3

# Counted rich-source construction and downstream working context, independently bounded.
build_t_batch_input_tokens: 70000
working_t_token_budget: 100000
working_t_symbol_token_budget: 16000
# Opt-in fractions of the effective run context bound, keyed by the three limits above.
construction_context_limits: {}
# Extra priority windows over grounded extracted evidence; see docs/construction.md.
construction_gap_anchors: []
# Explicit proposed premises; admitted before freeze with no source-paper authority.
hypothesis_premises: []
# Fresh-lifecycle recovery; each flag is strictly boolean and defaults off.
construction_partial_acceptance: false
construction_split_retry: false
construction_precise_attribution: false

# Full extraction is disabled until the operator supplies all three caps.
extraction-full:
  stages:
    extraction:
      model: claude-opus-5
      fallbacks: []
      effort: high
      thinking: adaptive
  fallbacks: []
  extraction_require_inference: true
  extraction_max_failed_papers: 8
  extraction_targeted_corrections: 3
  extraction_planned_output_tokens_per_page: 1200
  extraction_paper_continuation_limit: 24
  extraction_paper_cost_cap_usd: 15.0
  extraction_large_paper_limits:
    min_pages: 300
    continuation_limit: 48
    cost_cap_usd: 30.0
  construction_targeted_corrections: 2
  validation_attempts: 1
  token_cap: null
  cost_cap_usd: null
  extraction_cost_cap_usd: null
  working_t_symbol_token_budget: 32000
  working_t_symbol_growth_tokens_per_item: 256

# Planning reservation, not a prediction of semantic symbol reuse.
working_t_symbol_growth_tokens_per_item: 0

# Fixed cap on new commitments per window, based on its initial planning share.
construction_window_cap_multiplier: 2
# Independent target/polarity searches; 1 preserves sequential execution.
search_concurrency: 4
search_zero_inference_pause_after: 10  # 0 disables; explicit resume starts a new job window

# Opt-in subscription transport: select provider: claude_code and a full model id.
# Each run starts with a live isolation canary; extraction keeps its API workflow.
# CLI equivalents are subscription_usage, never measured API USD. Token caps apply;
# cost_cap_usd does not apply to subscription calls.
claude_code:
  concurrency: 4
  timeout_seconds: 300
  retries: 2
  retry_backoff_seconds: 1
  # Supplement the runtime inventory with private project names in local config.
  forbidden_terms: []

# ChatGPT subscription transport (Linux, bubblewrap, pinned Codex CLI 0.163.0).
# Select provider: codex_cli and model: gpt-6-luna; no API-key fallback.
# Extraction remains Opus 5 via API. Per-stage construction/search settings may
# select codex_cli. The isolation canary runs automatically before stage calls.
codex_cli:
  # Required for pilots after a successful codex-schema-preflight (same profile).
  schema_preflight_log: null
  concurrency: 4
  timeout_seconds: 300
  retries: 2
  retry_backoff_seconds: 1
  # Required separate ChatGPT login; never inherit the worker CODEX_HOME.
  auth_file: /home/dev/.config/ara/codex-home/auth.json
  forbidden_terms: []

# Operational admission bounds; exceeding one is a correction-eligible rejection.
local_validation_max_depth: 64
local_validation_max_nodes: 100000
local_validation_timeout_seconds: 2.0

# Optional external-gaps-v1 JSON file; logged AI findings are proposed before native gaps.
gap_file: null

# Opt-in shared construction vocabulary; use a fresh lifecycle.
construction_shared_vocabulary: false
construction_alignment_top_k: 0 # Per-symbol neighbours; candidate cap remains global.

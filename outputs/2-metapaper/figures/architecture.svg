    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(19.609031 71.946261)">Defeasible schemes + CQs</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(216.921094 47.940792)">T: source theory</text>
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(207.449219 59.943527)">Cited, stance-bound</text>
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(197.958594 71.946261)">One freeze per lifecycle</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(396.890969 47.941183)">H: proposals</text>
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(366.693312 59.943136)">Targets / cuts / premises</text>
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(370.158937 71.945871)">No source-paper credit</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(100.430469 167.2338)">Runtime: counted requests, immutable IDs, isolated providers</text>
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(100.250781 179.236534)">Model proposes → schema + provenance + full-T gates decide</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(65.393625 263.81028)">Licensed polarity search</text>
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(38.167063 275.813014)">CLOSED / OPEN / conditional on H</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(346.863406 263.81028)">Proposal writing</text>
    <text style="font-size: 10px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(279.650125 275.813014)">Bridge defended, not mechanically derived</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif; fill: #30373c" transform="translate(93.486797 349.583652)">Candidate → typed audit → local citations → k=3 union → verified export</text>

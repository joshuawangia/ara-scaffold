   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(39.501703 72.090963)">Unsafe belief</text>
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(62.842641 82.892721)">¬S</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(189.494859 72.090612)">Missing bridge</text>
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(173.602125 82.893073)">¬S → F (or directly R)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(338.709797 72.090612)">Assessment-relative</text>
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(362.494406 82.893073)">untruth F</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(339.180891 162.695763)">Required retraction</text>
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(381.019641 173.497521)">R</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(288.931781 117.39266)">F → R</text>
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(243.438188 128.195121)">Retraction Rule</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(47.978438 162.695412)">K → S: safety is necessary for knowledge</text>
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(67.622344 173.497873)">¬S → ¬K does not supply F or R</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(136.599609 240.691781)">Necessity needs its own support: R → ¬S</text>
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(70.230234 251.494242)">An exhaustive account of the relevant obligation’s grounds is missing.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif" transform="translate(126.331875 262.296703)">A one-way trigger cannot simply be reversed.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Serif', serif; text-anchor: middle" x="230.4" y="293.4288" transform="rotate(-0 230.4 293.4288)">Dashed boxes identify obligations for a proposed argument, not licensed steps.</text>
   </g>

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ara"
version = "0.1.0"
description = "Bank-constrained symbolic search scaffold"
requires-python = ">=3.13"
dependencies = [
    "anthropic==1.12.1",
    "z3-solver==5.1.0.0",
    "pyyaml==6.0.2",
    "jsonschema==4.26.0",
    "pypdf==6.21.1",
]

[project.scripts]
ara = "ara.runtime.cli:main"

[project.optional-dependencies]
ocr = [
    "paddleocr==3.7.0",
    "paddlex==3.7.2",
    "paddlepaddle==3.3.1",
    "pypdfium2==5.14.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["ara*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"ara.runtime" = ["claude_code_calibration.json", "ocr_models.json"]

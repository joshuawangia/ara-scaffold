[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ara"
version = "0.1.0"
description = "Bank-constrained symbolic search scaffold"
requires-python = ">=3.13"
dependencies = [
    "anthropic==1.12.1",
    "z3-solver==5.1.0.0",
    "pyyaml==6.0.2",
    "jsonschema==4.26.0",
    "pypdf==6.21.1",
    "markdown-it-py==4.0.0",
    "playwright==1.56.0",
    "pypdfium2==5.14.0",
]

[project.scripts]
ara = "ara.runtime.cli:main"

[project.optional-dependencies]
ocr = [
    "paddleocr==3.7.0",
    "paddlex==3.7.2",
    "paddlepaddle==3.3.1",
    "pypdfium2==5.14.0",
]

ocr-vl = [
    "torch==2.14.1+cpu",
    "torchvision==0.29.1+cpu",
    "transformers==5.20.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["ara*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"ara.runtime" = ["claude_code_calibration.json", "ocr_models.json", "ocr_vl_model.json"]

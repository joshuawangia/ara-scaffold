[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ara"
version = "0.1.0"
description = "Bank-constrained symbolic search scaffold"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.86",
    "z3-solver>=4.13",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "pypdf>=6.0,<7",
]

[project.scripts]
ara = "ara.runtime.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["ara*"]

[tool.setuptools.package-data]
"ara.runtime" = ["legacy_frozen_contract.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

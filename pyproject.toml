[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ara"
version = "0.1.0"
description = "Bank-constrained symbolic search scaffold"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.86", "z3-solver>=4.13", "pyyaml>=6.0", "jsonschema>=4.23"]

[project.scripts]
ara = "ara.runtime.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["ara*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
